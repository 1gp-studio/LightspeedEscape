<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
  :root {
    --bg: #090d1b;
    --accent: #ffb547;
    --shield: #52c6ff;
    --text-dim: #97a6c6;
    --font-ui: 'Chakra Petch', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-title: 'ZCOOL QingKe HuangYou', 'Chakra Petch', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  body { display: flex; font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }

  .poster {
    position: relative; width: 1024px; height: 1536px; overflow: hidden;
    background: var(--bg); isolation: isolate;
  }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scrim-top {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(9,13,27,0.94) 0%, rgba(9,13,27,0.86) 20%, rgba(9,13,27,0.68) 32%,
      rgba(9,13,27,0.40) 42%, rgba(9,13,27,0) 54%);
  }
  .scrim-bot {
    position: absolute; inset: 0;
    background: linear-gradient(0deg,
      rgba(6,9,20,0.97) 0%, rgba(6,9,20,0.90) 12%, rgba(6,9,20,0.42) 24%, rgba(6,9,20,0) 34%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 78% at 50% 46%, transparent 42%, rgba(4,7,16,0.55) 100%);
  }
  .frame {
    position: absolute; inset: 26px; border: 1px solid rgba(255,181,71,0.22); pointer-events: none;
  }
  .frame::before, .frame::after {
    content: ''; position: absolute; width: 92px; height: 3px; background: var(--accent);
    box-shadow: 0 0 14px rgba(255,181,71,0.75);
  }
  .frame::before { top: -2px; left: -2px; }
  .frame::after { bottom: -2px; right: -2px; }

  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; }

  /* ---------- head ---------- */
  .head { padding: 92px 72px 0; text-align: center; }
  .kicker {
    font-size: 26px; font-weight: 600; letter-spacing: 0.46em; color: #8fb4ff;
    text-shadow: 0 0 22px rgba(127,167,255,0.65); margin-right: -0.46em;
  }
  .name {
    margin-top: 34px; font-family: var(--font-title); font-weight: 400;
    font-size: 182px; line-height: 1; letter-spacing: 0.05em; margin-right: -0.05em;
    background: linear-gradient(180deg, #ffffff 0%, #ffe9c4 48%, #ffb547 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 34px rgba(255,181,71,0.45)) drop-shadow(0 6px 2px rgba(0,0,0,0.55));
  }
  .warp { position: relative; width: 560px; height: 3px; margin: 34px auto 0;
    background: linear-gradient(90deg, transparent, rgba(82,198,255,0.95), transparent); }
  .warp::after { content: ''; position: absolute; top: -2px; left: 34%; width: 170px; height: 7px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    box-shadow: 0 0 22px rgba(82,198,255,1), 0 0 46px rgba(82,198,255,0.65); }
  .tag {
    display: inline-block; margin: 32px auto 0; padding: 16px 34px; max-width: 820px;
    font-size: 30px; font-weight: 500; line-height: 1.5; letter-spacing: 0.02em;
    color: #d5dff2; background: rgba(9,13,27,0.58);
    box-shadow: inset 0 0 0 1px rgba(88,113,159,0.45);
    text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  }

  /* ---------- foot ---------- */
  .foot {
    padding: 34px 72px 46px;
    background: linear-gradient(180deg,
      rgba(6,9,20,0) 0%, rgba(6,9,20,0.72) 26%, rgba(6,9,20,0.94) 62%, rgba(6,9,20,0.98) 100%);
  }
  .chips { display: flex; justify-content: center; gap: 14px; margin-bottom: 24px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 22px; font-size: 24px; font-weight: 600; color: #dbe4f7;
    background: rgba(19,27,52,0.78); box-shadow: inset 0 0 0 1px rgba(88,113,159,0.55);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .chip i { font-style: normal; color: var(--accent); font-size: 22px; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 22px; border-top: 1px solid rgba(47,65,112,0.85);
    font-size: 23px; color: var(--text-dim); letter-spacing: 0.02em;
  }
  .bar b { color: #e6ecf8; font-weight: 600; }
  .dot { color: var(--shield); }

  /* ================= landscape banner (1280x640) ================= */
  body.banner .poster { width: 1280px; height: 640px; }
  body.banner .art { object-position: 50% 42%; }
  body.banner .scrim-top {
    background: linear-gradient(100deg,
      rgba(9,13,27,0.94) 0%, rgba(9,13,27,0.88) 34%, rgba(9,13,27,0.42) 58%, rgba(9,13,27,0.05) 78%);
  }
  body.banner .scrim-bot { background: linear-gradient(0deg, rgba(6,9,20,0.72) 0%, transparent 26%); }
  body.banner .vignette { background: radial-gradient(120% 120% at 30% 50%, transparent 40%, rgba(4,7,16,0.5) 100%); }
  body.banner .frame { inset: 18px; }
  body.banner .layer { flex-direction: row; align-items: flex-end; justify-content: flex-start; }
  body.banner .head { padding: 0 0 74px 72px; text-align: left; width: 720px; }
  body.banner .kicker { font-size: 19px; }
  body.banner .name { font-size: 128px; margin-top: 20px; }
  body.banner .warp { width: 420px; margin: 26px 0 0; }
  body.banner .tag { margin: 24px 0 0; max-width: 620px; font-size: 24px; }
  body.banner .foot { display: none; }
  body.banner .corner { position: absolute; right: 78px; bottom: 74px; text-align: right; }
  body.banner .corner .chips { flex-direction: column; align-items: flex-end; gap: 12px; margin: 0; }
  body.banner .corner .chip { font-size: 19px; padding: 10px 18px; gap: 8px; }
  body.banner .corner .chip i { font-size: 17px; }
  body.banner .corner small { display: block; margin-top: 20px; font-size: 18px; color: #b9c6e0; letter-spacing: 0.02em; text-shadow: 0 2px 12px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,0.9); }
  .corner { display: none; }
  body.banner .corner { display: block; }
</style>
</head>
<body>
<div class="poster">
  <img class="art" src="/assets/cover-art.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bot"></div>
  <div class="vignette"></div>
  <div class="frame"></div>
  <div class="layer">
    <div class="head">
      <div class="kicker">LIGHTSPEED &middot; ESCAPE</div>
      <div class="name">光速逃亡</div>
      <div class="warp"></div>
      <div class="tag">带着情报穿越五个星区，甩开身后的叛军舰队</div>
    </div>
    <div class="corner">
      <div class="chips">
        <span class="chip"><i>&#9670;</i>竖屏单手操作</span>
        <span class="chip"><i>&#9670;</i>实时战斗 · 随时暂停</span>
      </div>
      <small>v0.1.0 &nbsp;·&nbsp; 5 星区 · 60+ 随机事件</small>
    </div>
    <div class="foot">
      <div class="chips">
        <span class="chip"><i>&#9670;</i>竖屏单手操作</span>
        <span class="chip"><i>&#9670;</i>实时战斗 · 随时暂停</span>
        <span class="chip"><i>&#9670;</i>一局 20&ndash;30 分钟</span>
      </div>
      <div class="bar">
        <span><b>5</b> 个星区 <span class="dot">&middot;</span> <b>60+</b> 随机事件 <span class="dot">&middot;</span> <b>2</b> 艘舰船 <span class="dot">&middot;</span> <b>3</b> 档难度</span>
        <span>v0.1.0</span>
      </div>
    </div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).has('banner')) document.body.classList.add('banner');
</script>
</body>
</html>
