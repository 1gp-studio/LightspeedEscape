<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
  /* Dev-only 16:9 cover (1920x1080), drawn with the game's own pixel renderer.
     Screenshot (serve the project first: node serve.mjs):
       chrome --headless=new --window-size=1920,1080 --hide-scrollbars --virtual-time-budget=8000 \
              --screenshot=assets/banner.png "http://localhost:5173/tools/cover.html" */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070e; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#bg { position: absolute; inset: 0; width: 1920px; height: 1080px; image-rendering: pixelated; }
  .plate {
    position: absolute; left: 50%; top: 56px; transform: translateX(-50%);
    padding: 26px 64px 30px; text-align: center;
    background: #0b1022;
    box-shadow: 0 0 0 4px #05070e, inset 0 0 0 4px #7f8fb0, inset 0 0 0 8px #05070e, 0 12px 0 0 #05070e;
  }
  .kicker {
    font: 700 22px 'Silkscreen', monospace; letter-spacing: 0.42em; color: #9fb4de;
    margin-bottom: 6px;
  }
  .title {
    font: 400 132px/1.05 'ZCOOL QingKe HuangYou', 'Microsoft YaHei', sans-serif; letter-spacing: 0.08em;
    color: #ffd08a;
    text-shadow: 0 4px 0 #c9832a, 0 8px 0 #7a4512, 0 12px 0 #05070e;
  }
  .rail { height: 8px; margin: 16px auto 0; width: 86%;
    background: repeating-linear-gradient(90deg, #52c6ff 0 12px, transparent 12px 20px); }
  .corner { position: absolute; width: 36px; height: 36px; border: 0 solid #ffb547; }
  .c1 { left: -22px; top: -22px; border-left-width: 8px; border-top-width: 8px; }
  .c2 { right: -22px; top: -22px; border-right-width: 8px; border-top-width: 8px; }
  .c3 { left: -22px; bottom: -22px; border-left-width: 8px; border-bottom-width: 8px; }
  .c4 { right: -22px; bottom: -22px; border-right-width: 8px; border-bottom-width: 8px; }
  .tag {
    position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%);
    font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; color: #dfe7f7; letter-spacing: 0.12em;
    padding: 12px 36px; background: #0b1022;
    box-shadow: 0 0 0 4px #05070e, inset 0 0 0 4px #46546f, 0 8px 0 0 #05070e; white-space: nowrap;
  }
  .tag b { color: #ffb547; font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="plate">
    <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
    <div class="kicker">LIGHTSPEED · ESCAPE</div>
    <div class="title">光速逃亡</div>
    <div class="rail"></div>
  </div>
  <div class="tag">竖屏 · 实时暂停 · 五个星区 · <b>甩开叛军舰队</b></div>
</div>
<script src="/src/core/ns.js"></script>
<script src="/src/core/rng.js"></script>
<script src="/src/core/util.js"></script>
<script src="/src/data/rules.js"></script>
<script src="/src/data/systems.js"></script>
<script src="/src/data/weapons.js"></script>
<script src="/src/data/crew.js"></script>
<script src="/src/data/ships.js"></script>
<script src="/src/data/enemies.js"></script>
<script src="/src/sim/ship.js"></script>
<script src="/src/ui/dom.js"></script>
<script src="/src/ui/render.js"></script>
<script>
(function () {
  var G = window.G;
  var W = 1920, H = 1080, A = 4;          // A = CSS px per art pixel for the backdrop and effects
  var cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // deterministic RNG so the cover is reproducible
  var seed = 20260928;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  // ---- backdrop: dithered nebula + 3-tone starfield at art resolution ----
  var bw = W / A, bh = H / A;
  var bg = document.createElement('canvas'); bg.width = bw; bg.height = bh;
  var b = bg.getContext('2d');
  b.fillStyle = '#05070e'; b.fillRect(0, 0, bw, bh);
  var blobs = [
    { x: bw * 0.22, y: bh * 0.62, r: bh * 0.55, c: ['#0b1432', '#12204a', '#1a2c63'] },
    { x: bw * 0.80, y: bh * 0.40, r: bh * 0.50, c: ['#170b24', '#2a1234', '#3b1830'] },
  ];
  for (var y = 0; y < bh; y++) for (var x = 0; x < bw; x++) {
    blobs.forEach(function (o) {
      // wobbly edge: sum of low-frequency sines so the bands are not perfect ellipses
      var n = 0.10 * Math.sin(x * 0.07 + y * 0.03) + 0.07 * Math.sin(y * 0.11 - x * 0.05 + 1.7) + 0.05 * Math.sin((x + y) * 0.19);
      var d = Math.hypot(x - o.x, (y - o.y) * 1.3) / o.r + n;
      var lvl = d < 0.45 ? 2 : d < 0.7 ? 1 : d < 0.95 ? 0 : -1;
      // checkerboard dither at band edges
      if (lvl >= 0 && ((d > 0.4 && d < 0.5) || (d > 0.65 && d < 0.75) || d > 0.9) && (x + y) % 2) lvl--;
      if (lvl >= 0) { b.fillStyle = o.c[lvl]; b.fillRect(x, y, 1, 1); }
    });
  }
  var TONES = ['#34406a', '#7d8bb3', '#e6ecf8'];
  for (var i = 0; i < 520; i++) {
    b.fillStyle = TONES[rnd() < 0.6 ? 0 : rnd() < 0.7 ? 1 : 2];
    b.fillRect(Math.floor(rnd() * bw), Math.floor(rnd() * bh), 1, 1);
  }
  for (i = 0; i < 14; i++) {              // a few plus-shaped bright stars
    var sx = Math.floor(rnd() * bw), sy = Math.floor(rnd() * bh);
    b.fillStyle = '#e6ecf8'; b.fillRect(sx, sy - 1, 1, 3); b.fillRect(sx - 1, sy, 3, 1);
  }
  ctx.drawImage(bg, 0, 0, W, H);

  // ---- ships: rendered by G.Render.miniShip, then rotated so they face each other (FTL style) ----
  function shipCanvas(id, flip, w, h) {
    var c = document.createElement('canvas');
    c.style.width = w + 'px'; c.style.height = h + 'px';
    G.Render.miniShip(c, id, { width: w, height: h, pad: 0.6, flip: flip });
    return c;
  }
  function place(c, cx, cy, rot, scale) {
    ctx.save();
    ctx.translate(Math.round(cx), Math.round(cy));
    ctx.rotate(rot);
    var w = c.width * scale, h = c.height * scale;
    ctx.drawImage(c, -Math.round(w / 2), -Math.round(h / 2), w, h);
    ctx.restore();
  }
  // miniShip draws at devicePixelRatio; normalise to CSS px before scaling
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var player = shipCanvas('falcon', false, 150, 200);
  var enemy = shipCanvas('cruiser', true, 130, 150);

  // shield bubble (dithered ring) around the enemy, drawn at art resolution
  function ring(cx, cy, rx, ry, col) {
    ctx.fillStyle = col;
    for (var t = 0; t < 720; t++) {
      var a = t / 720 * Math.PI * 2;
      var px = Math.round((cx + Math.cos(a) * rx) / A), py = Math.round((cy + Math.sin(a) * ry) / A);
      if ((px + py) % 2 === 0) ctx.fillRect(px * A, py * A, A, A);
    }
  }
  var EX = 1440, EY = 600, PX = 470, PY = 620;
  place(player, PX, PY, Math.PI / 2, 3 / dpr);   // nose to the right
  place(enemy, EX, EY, Math.PI / 2, 3 / dpr);    // flipped template: nose to the left
  ring(EX, EY, 300, 280, '#52c6ff');
  ring(EX, EY, 314, 294, '#2a6f97');

  // ---- lasers: green pixel bolts with trails, one absorbed by the shield, one hitting ----
  function bolt(x0, y0, x1, y1, len, core, trail) {
    var n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / A));
    for (var k = 0; k < len; k++) {
      var t = 1 - k / n;
      var px = Math.round((x0 + (x1 - x0) * t) / A) * A, py = Math.round((y0 + (y1 - y0) * t) / A) * A;
      ctx.fillStyle = k < 3 ? core : trail;
      ctx.fillRect(px, py, A, A * (k < 3 ? 2 : 1));
    }
  }
  bolt(PX + 330, PY - 50, 1110, 500, 22, '#eaffea', '#62e07e');
  bolt(PX + 330, PY - 50, 960, 560, 22, '#eaffea', '#62e07e');
  bolt(PX + 330, PY + 40, 1150, 640, 18, '#eaffea', '#62e07e');
  // enemy red shot heading back
  bolt(EX - 330, EY + 60, 900, 700, 20, '#ffe4e4', '#ff5d5d');

  // shield hit ripple where a bolt met the bubble
  function burst(cx, cy, r, cols) {
    for (var yy = -r; yy <= r; yy++) for (var xx = -r; xx <= r; xx++) {
      var d = Math.hypot(xx, yy) / r; if (d > 1 || rnd() < d * 0.55) continue;
      ctx.fillStyle = cols[Math.min(cols.length - 1, Math.floor(d * cols.length))];
      ctx.fillRect(Math.round(cx / A + xx) * A, Math.round(cy / A + yy) * A, A, A);
    }
  }
  burst(1146, 520, 7, ['#ffffff', '#b8ecff', '#52c6ff']);
  // explosion on the enemy hull
  burst(1330, 660, 9, ['#ffffff', '#ffe08a', '#ff8a3d', '#c2410c', '#3a2a2a']);
  for (i = 0; i < 26; i++) {               // debris pixels
    ctx.fillStyle = rnd() < 0.5 ? '#ffb547' : '#6f7f9c';
    ctx.fillRect(Math.round((1330 + (rnd() - 0.5) * 150) / A) * A, Math.round((660 + (rnd() - 0.5) * 130) / A) * A, A, A);
  }
})();
</script>
</body>
</html>
