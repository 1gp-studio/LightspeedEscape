        ctx.beginPath(); ctx.arc(cx, cy, size * 0.66, 0, Math.PI * 2); ctx.fill();
        drawGlyph(ctx, r2.sys, cx, cy, size, sysColor(ship, sys));
        if (sys && sys.damage > 0 && sys.damage < sys.level && !lod) {
          // repair progress ring
          ctx.strokeStyle = 'rgba(111,211,106,0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, size * 0.66, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (sys.repairProg || 0)); ctx.stroke();
        }
      }
      if (r2.fire > 0) drawFire(ctx, r2, b2, t, lod, tiles);
      if (!ship.crewless && r2.o2 < 50 && t >= 28) {
        ctx.font = '600 11px "Chakra Petch", sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillStyle = 'rgba(120,0,20,0.9)';
        ctx.fillText(Math.round(r2.o2) + '%', b2.x + 4, b2.y + 3);
      }
    }
  }

  function drawFire(ctx, rm, b, t, lod, tiles) {
    var fl = 0.8 + 0.2 * Math.sin(R.t * 11 + rm.id);
    if (lod) {
      ctx.fillStyle = 'rgba(255,120,40,' + (0.35 * fl).toFixed(3) + ')';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      drawGlyph(ctx, 'fire', b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) * 0.7, '#ff8a3d');
      return;
    }
    ctx.fillStyle = 'rgba(255,110,30,' + (0.18 + 0.1 * rm.fire / tiles).toFixed(3) + ')';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    for (var k = 0; k < rm.fire; k++) {
      var tx = k % rm.w, ty = Math.floor(k / rm.w) % rm.h;
      var cx = b.x + (tx + 0.5) * t, cy = b.y + (ty + 0.5) * t;
      var s = t * (0.62 + 0.12 * Math.sin(R.t * 13 + k * 2.1 + rm.id));
      drawGlyph(ctx, 'fire', cx, cy + t * 0.04, s * 1.08, '#c2410c');
      drawGlyph(ctx, 'fire', cx, cy + t * 0.08, s * 0.8, '#ff8a3d');
      drawGlyph(ctx, 'fire', cx, cy + t * 0.14, s * 0.45, '#ffd66b');
    }
  }

  function drawBreach(ctx, g, rm, b, t) {
    var n = rm.w * rm.h;
    for (var k = 0; k < rm.breach; k++) {
      var idx = n - 1 - (k % n), tx = idx % rm.w, ty = Math.floor(idx / rm.w);
      var cx = b.x + (tx + 0.5) * t, cy = b.y + (ty + 0.5) * t, s = t * 0.32;
      ctx.fillStyle = 'rgba(8,10,20,0.85)';
      ctx.beginPath();
      for (var j = 0; j < 7; j++) {
        var a = j / 7 * Math.PI * 2, rr = s * (0.55 + 0.45 * hash(rm.id * 7 + j, k));
        var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (j) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(20,24,40,0.8)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (j = 0; j < 4; j++) {
        var an = hash(rm.id, j + k * 4) * Math.PI * 2, l = s * (1.1 + 0.9 * hash(j, rm.id + k));
        ctx.moveTo(cx + Math.cos(an) * s * 0.5, cy + Math.sin(an) * s * 0.5);
        ctx.lineTo(cx + Math.cos(an + 0.3) * l, cy + Math.sin(an + 0.3) * l);
      }
      ctx.stroke();
      // air leaking
      var ph = (R.t * 1.6 + k * 0.37) % 1;
      ctx.fillStyle = 'rgba(200,220,255,' + (0.35 * (1 - ph)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, s * (0.4 + ph * 1.2), 0, Math.PI * 2); ctx.fill();
    }
  }

  // ------------------------------------------------------------------ crew
  function drawCrew(ctx, g, selId) {
    var ship = g.ship, t = g.L.tile, count = {}, i;
    if (!ship.crew || !ship.crew.length) return;
    for (i = 0; i < ship.crew.length; i++) {
      var c0 = ship.crew[i], d0 = c0.path.length ? -1 : c0.room;
      count[d0] = (count[d0] || 0) + 1;
    }
    var lp = R.lastPos[g.side];
    for (i = 0; i < ship.crew.length; i++) {
      var c = ship.crew[i], race = G.data.crew.races[c.race] || G.data.crew.races.human;
      var p = G.Crew.pos(ship, c);
      var s = gp(g, p.x, p.y);
      lp[c.name] = s;
      var many = !c.path.length && count[c.room] > 2;
      var rad = t * (many ? 0.45 : 0.55) / 2;
      rad = Math.max(3.5, rad);
      if (c.path.length) s.y += Math.sin(R.t * 14 + i) * Math.min(1.2, t * 0.03);
      if (selId && c.id === selId) {
        var pulse = 0.5 + 0.5 * Math.sin(R.t * 6);
        ctx.strokeStyle = COL.amber;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, rad + 3 + pulse * 1.5, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = race.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(s.x - rad * 0.3, s.y - rad * 0.32, rad * 0.38, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = g.flip ? '#4a0d14' : '#10162a';
      ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, Math.PI * 2); ctx.stroke();
      if (c.task === 'man' && t >= 20) {
        ctx.fillStyle = g.flip ? '#ff5d5d' : '#62e07e';
        ctx.beginPath(); ctx.arc(s.x + rad * 0.75, s.y - rad * 0.75, Math.max(1.8, rad * 0.28), 0, Math.PI * 2); ctx.fill();
      }
      if (c.hp < c.hpMax) {
        var f = Math.max(0, c.hp / c.hpMax), bw = Math.max(12, rad * 2.2);
        ctx.fillStyle = 'rgba(10,12,24,0.8)';
        ctx.fillRect(s.x - bw / 2 - 1, s.y - rad - 7, bw + 2, 5);
        ctx.fillStyle = f > 0.6 ? '#6fd36a' : f > 0.3 ? '#f2c94c' : '#ff5d5d';
        ctx.fillRect(s.x - bw / 2, s.y - rad - 6, bw * f, 3);
      }
    }
  }

  // ------------------------------------------------------------------ shields
  function drawShield(ctx, g) {
    var ship = g.ship, max = G.Ship.maxLayers(ship), layers = ship.shieldLayers;
    if (max <= 0 && layers <= 0) return;
    var b = bubble(g);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(1, b.ry / b.rx);
    var gr = ctx.createRadialGradient(0, 0, b.rx * 0.6, 0, 0, b.rx);
    gr.addColorStop(0, 'rgba(' + COL.shield + ',0)');
    gr.addColorStop(1, 'rgba(' + COL.shield + ',' + (0.05 + 0.07 * layers).toFixed(3) + ')');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, b.rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.lineWidth = layers > 0 ? 1 + layers * 0.9 : 1;
    ctx.strokeStyle = 'rgba(' + COL.shield + ',' + (layers > 0 ? 0.3 + 0.14 * layers : 0.14).toFixed(3) + ')';
    if (layers <= 0) ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    // inner rings per extra layer
    for (var k = 1; k < layers; k++) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(' + COL.shield + ',0.22)';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx - k * 4, b.ry - k * 4, 0, 0, Math.PI * 2); ctx.stroke();
    }
    if (layers < max && ship.shieldCharge > 0) {
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(' + COL.shield + ',0.85)';
      var st = -Math.PI / 2;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx + 3, b.ry + 3, 0, st, st + Math.PI * 2 * ship.shieldCharge); ctx.stroke();
    }
    ctx.restore();
  }

  // Entry point of segment o->c into the ellipse (or null when o is inside / no crossing).
  function hitEllipse(o, c, e) {
    var dx = c.x - o.x, dy = c.y - o.y, ox = (o.x - e.x) / e.rx, oy = (o.y - e.y) / e.ry, ddx = dx / e.rx, ddy = dy / e.ry;
    var A = ddx * ddx + ddy * ddy, Bq = 2 * (ox * ddx + oy * ddy), C = ox * ox + oy * oy - 1;
    if (C <= 0 || A <= 0) return null;
    var disc = Bq * Bq - 4 * A * C;
    if (disc < 0) return null;
    var s = (-Bq - Math.sqrt(disc)) / (2 * A);
    if (s < 0 || s > 1) return null;
    return { x: o.x + dx * s, y: o.y + dy * s, s: s };
  }

  // ------------------------------------------------------------------ projectiles
  function shooter(side, slot) {
    var g = geo(side);
    if (!g) return null;
    var ws = g.ship.systems.weapons;
    var base = ws ? roomMid(g, ws.room) : shipMid(g);
    var n = g.ship.weapons.length || 1;
    if (slot != null) base = { x: base.x + (slot - (n - 1) / 2) * g.L.tile * 0.35, y: base.y };
    return base;
  }

  function hazardOrigin(id, to) {
    var hv = hash(String(id).length + parseInt(String(id).replace(/\D/g, '') || '1', 10), 3.7);
    var g = geo(to);
    var m = g ? shipMid(g) : { x: R.w / 2, y: R.h / 2 };
    return { x: hv < 0.5 ? -20 : R.w + 20, y: m.y + (hv - 0.5) * R.h * 0.4 };
  }

  function origin(p) {
    if (p.from === 'hazard') {
      if (p.kind === 'fleet') {
        var hv = hash(parseInt(String(p.id).replace(/\D/g, '') || '1', 10), 1.3);
        return { x: hv < 0.5 ? -10 : R.w + 10, y: R.h + 10 };
      }
      return hazardOrigin(p.id, p.to);
    }
    if (p.weapon == null) { var g = geo(p.from); return g ? shipMid(g) : null; }
    return shooter(p.from, p.slot);
  }

  function dest(p, o) {
    var g = geo(p.to);
    if (!g) return null;
    var c = roomMid(g, p.target);
    if (p.kind !== 'missile' && g.ship.shieldLayers > 0 && o) {
      var hit = hitEllipse(o, c, bubble(g));
      if (hit) return { x: hit.x, y: hit.y, shield: true };
    }
    return c;
  }

  function posAt(o, d, f, arc) {
    var x = o.x + (d.x - o.x) * f, y = o.y + (d.y - o.y) * f;
    if (arc) {
      var dx = d.x - o.x, dy = d.y - o.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var off = Math.sin(Math.PI * f) * Math.min(46, len * 0.14) * arc;
      x += -dy / len * off; y += dx / len * off;
    }
    return { x: x, y: y };
  }

  function drawProjectiles(ctx, c) {
    var list = c.projectiles;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (p.delay > 0) continue;
      var o = origin(p), d = o && dest(p, o);
      if (!o || !d) continue;
      var f = G.U.clamp(p.t / p.dur, 0, 1);
      var side = p.from === 'player' ? 'player' : 'enemy';
      var col = SHOT[side][p.kind] || '#ff5a4f';
      var arc = p.kind === 'missile' ? ((p.slot || 0) % 2 ? -1 : 1) : 0;
      var a = posAt(o, d, f, arc);
      if (p.kind === 'laser') {
        var b = posAt(o, d, Math.max(0, f - 0.07), arc);
        ctx.strokeStyle = shade(col, 0, 0.35); ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(a.x, a.y); ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(a.x, a.y); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2); ctx.lineTo(a.x, a.y); ctx.stroke();
      } else if (p.kind === 'ion') {
        var pr = 4 + Math.sin(R.t * 30 + i) * 1;
        ctx.fillStyle = shade(col, 0, 0.25);
        ctx.beginPath(); ctx.arc(a.x, a.y, pr * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(a.x, a.y, pr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(a.x, a.y, pr * 0.45, 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'missile') {
        var tl = posAt(o, d, Math.max(0, f - 0.12), arc);
        var gr = ctx.createLinearGradient(tl.x, tl.y, a.x, a.y);
        gr.addColorStop(0, 'rgba(255,120,40,0)'); gr.addColorStop(1, 'rgba(255,170,70,0.85)');
        ctx.strokeStyle = gr; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tl.x, tl.y); ctx.lineTo(a.x, a.y); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
        var ang = Math.atan2(a.y - tl.y, a.x - tl.x);
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(ang);
        ctx.fillStyle = col; ctx.fillRect(-7, -2, 9, 4);
        ctx.fillStyle = '#ff5d5d'; ctx.beginPath(); ctx.moveTo(2, -2); ctx.lineTo(5, 0); ctx.lineTo(2, 2); ctx.fill();
        ctx.restore();
        ctx.globalCompositeOperation = 'lighter';
        if (Math.random() < 0.5) addPart({ x: tl.x, y: tl.y, vx: rnd(-8, 8), vy: rnd(-8, 8), life: 0.5, size: rnd(2, 4), col: '160,160,180', type: 'smoke' });
      } else if (p.kind === 'asteroid') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(R.t * 3 + i);
        ctx.fillStyle = '#8b7a66'; ctx.strokeStyle = '#3d342b'; ctx.lineWidth = 1;
        ctx.beginPath();
        for (var k = 0; k < 7; k++) {
          var an = k / 7 * Math.PI * 2, rr = 5 + 2 * hash(i, k);
          if (k) ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); else ctx.moveTo(Math.cos(an) * rr, Math.sin(an) * rr);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
        ctx.globalCompositeOperation = 'lighter';
      } else {
        // fleet shell
        var tb = posAt(o, d, Math.max(0, f - 0.1), 0);
        ctx.strokeStyle = 'rgba(255,80,60,0.45)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tb.x, tb.y); ctx.lineTo(a.x, a.y); ctx.stroke();
        ctx.fillStyle = '#ffd0c0';
        ctx.beginPath(); ctx.arc(a.x, a.y, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function sweepPoints(g, rooms) {
    var pts = rooms.map(function (id) { return roomMid(g, id); });
    if (pts.length === 1) {
      var t = g.L.tile * 0.45;
      pts = [{ x: pts[0].x - t, y: pts[0].y }, { x: pts[0].x + t, y: pts[0].y }];
    }
    return pts;
  }
  function along(pts, f) {
    var n = pts.length - 1;
    if (n <= 0) return pts[0];
    var x = G.U.clamp(f, 0, 1) * n, k = Math.min(n - 1, Math.floor(x)), u = x - k;
    return { x: pts[k].x + (pts[k + 1].x - pts[k].x) * u, y: pts[k].y + (pts[k + 1].y - pts[k].y) * u };
  }

  function drawBeams(ctx, c) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var i = 0; i < c.beams.length; i++) {
      var b = c.beams[i], o = shooter(b.from, b.slot), g = geo(b.to);
      if (!o || !g) continue;
      var col = SHOT[b.from === 'player' ? 'player' : 'enemy'].beam;
      if (b.t < b.delay) {
        var q = b.t / b.delay, rr = 3 + 9 * q;
        var gr = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, rr * 2);
        gr.addColorStop(0, 'rgba(255,255,255,' + (0.5 + 0.5 * q) + ')');
        gr.addColorStop(0.35, shade(col, 0, 0.6 * q + 0.2));
        gr.addColorStop(1, shade(col, 0, 0));
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(o.x, o.y, rr * 2, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      var f = G.U.clamp((b.t - b.delay) / b.dur, 0, 1);
      var pts = sweepPoints(g, b.rooms), pt = along(pts, f);
      var blocked = b.dmg > 0 ? b.dmg - g.ship.shieldLayers <= 0 : g.ship.shieldLayers > 0;
      // scorch trail over the swept rooms
      ctx.strokeStyle = shade(col, 0, blocked ? 0.15 : 0.45);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      var n = pts.length - 1;
      for (var k = 1; k <= n && k / n <= f; k++) ctx.lineTo(pts[k].x, pts[k].y);
      ctx.lineTo(pt.x, pt.y); ctx.stroke();
      // the beam itself (ends on the shield when fully blocked)
      var end = pt;
      if (blocked) { var hit = hitEllipse(o, pt, bubble(g)); if (hit) end = hit; }
      var jitter = Math.sin(R.t * 60) * 0.8;
      ctx.strokeStyle = shade(col, 0, 0.35); ctx.lineWidth = 9 + jitter;
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(end.x, end.y); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(end.x, end.y); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(end.x, end.y); ctx.stroke();
      if (Math.random() < 0.8) addPart({ x: end.x, y: end.y, vx: rnd(-60, 60), vy: rnd(-60, 60), life: 0.3, size: 2, col: '255,220,160', type: 'spark' });
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ particles / effects
  function addPart(p) {
    if (R.parts.length > 320) R.parts.shift();
    p.max = p.life;
    R.parts.push(p);
  }

  function explode(x, y, scale, col) {
    scale = scale || 1;
    col = col || '255,170,70';
    addPart({ x: x, y: y, vx: 0, vy: 0, life: 0.35, size: 14 * scale, col: '255,240,200', type: 'flash' });
    addPart({ x: x, y: y, vx: 0, vy: 0, life: 0.45, size: 6 * scale, col: col, type: 'ring' });
    var n = Math.round(10 * scale);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = rnd(30, 130) * scale;
      addPart({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.25, 0.6), size: rnd(1.2, 2.6), col: col, type: 'spark' });
    }
    for (i = 0; i < Math.round(3 * scale); i++) {
      addPart({ x: x + rnd(-4, 4), y: y + rnd(-4, 4), vx: rnd(-12, 12), vy: rnd(-12, 12), life: rnd(0.6, 1.1), size: rnd(4, 8) * scale, col: '90,90,110', type: 'smoke' });
    }
  }

  function floatText(x, y, text, col) {
    addPart({ x: x, y: y, vx: 0, vy: -26, life: 0.9, size: 13, col: col, type: 'text', text: text });
  }

  function stepParts(ctx, dt) {
    var list = R.parts, j = 0;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      p.life -= dt;
      if (p.life <= 0) continue;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'spark') { p.vx *= 0.92; p.vy *= 0.92; }
      list[j++] = p;
    }
    list.length = j;
    for (i = 0; i < list.length; i++) {
      p = list[i];
      var k = p.life / p.max;
      if (p.type === 'text') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.font = '700 ' + p.size + 'px "Chakra Petch", "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,' + (0.6 * k) + ')';
        ctx.fillText(p.text, p.x + 1, p.y + 1);
        ctx.fillStyle = 'rgba(' + p.col + ',' + k + ')';
        ctx.fillText(p.text, p.x, p.y);
        continue;
      }
      if (p.type === 'smoke') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(' + p.col + ',' + (0.35 * k).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - k * 0.6), 0, Math.PI * 2); ctx.fill();
        continue;
      }
      ctx.globalCompositeOperation = 'lighter';
      if (p.type === 'flash') {
        var gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (1.4 - k * 0.4));
        gr.addColorStop(0, 'rgba(' + p.col + ',' + k.toFixed(3) + ')');
        gr.addColorStop(1, 'rgba(' + p.col + ',0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - k * 0.4), 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'ring') {
        ctx.strokeStyle = 'rgba(' + p.col + ',' + (0.8 * k).toFixed(3) + ')';
        ctx.lineWidth = 2;

  // vertical padding (tiles; default .25 + .25 = SPEC's h+.5) reserved above / below the room grid.
  function fit(box, sw, sh, flip, padTop, padBot) {

    // of that so the hull stays clear of the header / weapon-chip strips (which are opaque over the rest)

    else if (s.mode === 'crew' && !G.U.byId(r.player.crew, s.crewId)) resetSel();
    else if (s.mode === 'system' && (s.until <= V.clock || !r.player.systems[s.sysId])) resetSel();

    Tips.done('t_target');
    resetSel();
    sync();

  function power(r, sid, dir) {

      audio('power');
      Tips.done('t_power');

      note(dir > 0 ? rsn(G.Ship.powerBlock(p, sid)) : '该系统没有能量可减');
      if (dir > 0) Tips.trigger('t_power');

    return ok;

  // One power step from a chip tap / swipe; returns whether it succeeded (input.js counts only successes).

    var r = run();

    focusSys(sid);               // before power(): focusSys resets the selection (and its note)
    var ok = power(r, sid, dir);
    sync();
    return ok;

  function tapPlayer(r, x, y) {
    var room = G.Render ? G.Render.pickRoom('player', x, y) : -1;
    var p = r.player, s = V.sel;
    if (room < 0) { resetSel(); return; }
    var here = p.crew.filter(function (c) { return G.Crew.dest(c) === room; });
    if (s.mode === 'crew') {
      var cur = G.U.byId(p.crew, s.crewId);
      if (cur && G.Crew.dest(cur) === room) {
        // repeat taps on the selected crew's room cycle through the crew there
        if (here.length > 1) { selCrew(here[(here.indexOf(cur) + 1) % here.length].id); audio('click'); }
        else resetSel();
        return;
      }
      if (cur && G.Crew.order(p, cur.id, room)) {
        audio('click');
        Tips.done('t_crew');
        resetSel();
        sync();
      } else { audio('deny'); note('无法到达该舱室'); }
      return;
    }
    if (here.length) { selCrew(here[0].id); audio('click'); } else resetSel();

  function tap(act, data, x, y) {
    var r = run();
    data = data || {};
    if (!r) return;
    switch (act) {

      case 'pause': if (inPlay(r) && G.App) { audio('click'); G.App.setPaused(!G.App.paused); } return;
      case 'map': case 'ship': case 'store':

        if (act === 'map') Tips.done('t_map');
        G.UI.open(act);
        return;
      case 'ctx': case 'noop': return;

    if (!inPlay(r)) return;
    var p = r.player, s = V.sel, w;
    switch (act) {

      case 'wempty': resetSel(); note('空武器槽'); break;
      case 'chip': chipStep(data.sys, +1); break;
      case 'reactor':
        focusSys(s.mode === 'system' && s.sysId ? s.sysId : 'shields');
        note('反应堆 ' + G.Ship.reactorFree(p) + ' 格空闲 / 共 ' + p.reactor + ' 格');
        break;
      case 'sysMinus': case 'sysPlus':
        if (s.mode === 'system') { power(r, s.sysId, act === 'sysPlus' ? 1 : -1); s.until = V.clock + FOCUS_TIME; sync(); }
        break;
      case 'crew':

        audio('click');
        break;
      case 'crewStation':
        w = G.U.byId(p.crew, s.crewId);
        if (w && w.station != null && G.Crew.order(p, w.id, w.station)) { audio('click'); resetSel(); sync(); }
        else { audio('deny'); note('没有指定岗位'); }
        break;
      case 'crewCancel': resetSel(); audio('click'); break;
      case 'allStations': G.Crew.returnToStations(p); resetSel(); audio('click'); Tips.done('t_crew'); sync(); break;
      case 'player': tapPlayer(r, x, y); break;
      case 'enemy': resetSel(); break;
      case 'qp': setTarget(r, +data.room); break;
      case 'clearTarget':
        if (s.mode === 'weapon') { G.Combat.setTarget(r, s.slot, null); audio('click'); sync(); }
        break;
      case 'wpower':
        if (s.mode === 'weapon') {
          w = p.weapons[s.slot];
          if (w && G.Ship.toggleWeapon(p, s.slot)) { V.note = null; audio('power'); Tips.done('t_power'); sync(); }
          else { audio('deny'); note(rsn(G.Ship.toggleBlock(p, s.slot))); Tips.trigger('t_power'); }
        }
        break;
      case 'volley': G.Combat.setVolley(r, !r.volley); audio('click'); Tips.done('t_shield'); sync(); break;
      case 'flee':
        if (G.Combat.canFlee(r) && !fleeOk(r)) { audio('deny'); note('燃料耗尽'); }
        else if (G.Combat.canFlee(r)) { resetSel(); audio('click'); Tips.done('t_ftl'); G.UI.open('map', { flee: true }); }
        else audio('deny');
        break;
      default: resetSel();
    }
  }

  // ---- press-drag-release targeting
  function canAim() {
    var r = run();
    return !!(r && r.mode === 'combat' && r.combat && !r.combat.result && V.sel.mode === 'weapon');
  }

  function aimRoom(x, y) {
    if (!G.Render) return -1;
    var room = G.Render.pickRoom('enemy', x, y);
    if (room < 0) room = G.Render.nearestRoom('enemy', x, y, 16);
    return room;
  }

  function roomLabel(ship, id) {
    var rm = ship.rooms[id];
    return rm && rm.sys ? defs()[rm.sys].name : '空舱室';
  }

  function aimMove(x, y, cx, cy) {
    var r = run();
    if (!canAim()) { aimCancel(); return; }
    var room = aimRoom(x, y), e = r.combat.enemy;
    if (room < 0) { V.aim = { room: -1, rooms: [] }; E.callout.hidden = true; return; }
    var rooms = G.Combat.previewBeam(r, V.sel.slot, room);
    V.aim = { room: room, rooms: rooms };
    var def = G.data.weapons[r.player.weapons[V.sel.slot].id];
    var label = def.type === 'beam' ? rooms.map(function (id) { return roomLabel(e, id); }).join(' → ') : roomLabel(e, room);
    txt(E.callout, label);
    E.callout.hidden = false;
    var mr = E.mv.getBoundingClientRect();
    var lx = cx - mr.left, half = Math.min(mr.width / 2 - 4, (E.callout.offsetWidth || 80) / 2 + 2);
    lx = G.U.clamp(lx, half + 4, mr.width - half - 4);
    E.callout.style.left = lx + 'px';
    E.callout.style.top = Math.max(2, cy - mr.top - 40 - 28) + 'px';
  }

  function aimEnd(x, y, cx, cy) {
    var r = run(), z = V.layout.enemyZone;
    var outside = !z || x < z.x - 24 || x > z.x + z.w + 24 || y < z.y - 24 || y > z.y + z.h + 24;
    if (!canAim() || outside) { aimCancel(); return; }
    // the release point decides; fall back to the last highlighted room (finger lifted just off the ship)
    var room = aimRoom(x, y);
    if (room < 0 && V.aim) room = V.aim.room;
    V.aim = null;
    E.callout.hidden = true;
    if (room >= 0) setTarget(r, room);
  }

  function aimCancel() { V.aim = null; if (E.callout) E.callout.hidden = true; }

  // ------------------------------------------------------------------ per-frame DOM update
  function hullClass(el, f) {
    cls(el, 'mid', f > 0.3 && f <= 0.6);
    cls(el, 'low', f <= 0.3);
  }

  function updateTop(r) {
    var p = r.player, f = p.hull / p.hullMax;
    txt(E.hullNum, p.hull);
    txt(E.hullMaxT, '/' + p.hullMax);
    bar(E.hullFill, f);
    prop(E.hullSeg, '--seg', (100 / Math.max(1, p.hullMax)) + '%');
    hullClass(E.hull, f);
    txt(E.scrap, r.res.scrap);
    txt(E.fuel, r.res.fuel);
    txt(E.missiles, r.res.missiles);
    cls(E.resFuel, 'zero', r.res.fuel <= 0);
    cls(E.resMis, 'zero', r.res.missiles <= 0);
  }

  function buildEnemy(e) {
    var h = G.dom.h;
    B.enemy = e;
    var fac = G.data.text.factionNames[e.faction] || '';
    txt(E.ezName, e.name);
    txt(E.ezFac, fac + (e.boss ? '' : e.elite ? ' · 精英' : ''));
    G.dom.clear(E.ezChips);
    E.ewc = e.weapons.map(function (w) {
      var def = G.data.weapons[w.id], fill = h('i');
      var el = h('span.ewc', h('span.ewn', def.short), h('span.ewb', fill));
      E.ezChips.appendChild(el);
      return { el: el, fill: fill };
    });
    B.shKey = '';
  }

  function updateEnemy(r) {
    var c = r.combat, e = c.enemy;
    if (B.enemy !== e || E.ewc.length !== e.weapons.length) buildEnemy(e);
    cls(E.ezHead, 'phase2', e.phase === 2);
    // shield pips: capacity = floor(level/2); filled = layers; next one shows the charge
    var cap = e.systems.shields ? Math.floor(e.systems.shields.level / 2) : 0;
    var maxL = G.Ship.maxLayers(e);
    if (B.shKey !== String(cap)) {
      B.shKey = String(cap);
      G.dom.clear(E.ezShields);
      E.shPips = [];
      for (var i = 0; i < cap; i++) {
        var fill = G.dom.h('i');
        var pip = G.dom.h('span.shp', fill);
        E.ezShields.appendChild(pip);
        E.shPips.push({ el: pip, fill: fill });
      }
    }
    for (i = 0; i < E.shPips.length; i++) {
      var sp = E.shPips[i];
      cls(sp.el, 'up', i < e.shieldLayers);
      cls(sp.el, 'dead', i >= maxL);
      bar(sp.fill, i < e.shieldLayers ? 1 : (i === e.shieldLayers && i < maxL ? e.shieldCharge : 0));
    }
    show(E.ezShields, cap > 0);
    txt(E.ezEva, '闪避 ' + G.Ship.evasion(e) + '%');
    bar(E.ezHullFill, e.hull / e.hullMax);
    hullClass(E.ezHullFill, e.hull / e.hullMax);
    txt(E.ezHullNum, e.hull + '/' + e.hullMax);
    for (i = 0; i < E.ewc.length; i++) {
      var w = e.weapons[i], ch = E.ewc[i], f = w.charge / G.data.weapons[w.id].charge;
      bar(ch.fill, f);
      cls(ch.el, 'off', !w.on);
      cls(ch.el, 'hot', w.on && f >= 0.85);
    }
    show(E.ezVolley, !!e.volley);
    show(E.ezFtl, !!e.fleeing);
    if (e.fleeing) {
      bar(E.ezFtlFill, e.ftl);
      txt(E.ezFtlTxt, '跃迁充能 ' + Math.floor(e.ftl * 100) + '%');
    }
  }

  function updateCard(r) {
    var s = r.sector, b = G.Run.beacon(r);
    if (!s || !b) return;
    var type = G.data.sectors.types[s.type] || {};
    var key = [r.sectorIndex, r.at, r.mode, s.fleet, r.res.fuel, b.store ? 1 : 0].join('|');
    if (B.cardKey === key) return;
    B.cardKey = key;
    txt(E.bcSector, '星区 ' + (r.sectorIndex + 1) + ' · ' + s.name);
    txt(E.bcType, type.name || '');
    prop(E.ezCard, '--sector', type.accent || '#58c7d6');
    var kn = G.data.text.kindNames;
    var kind = b.id === s.exit && b.kind !== 'boss' ? kn.exit : (kn[b.kind] || '');
    if (b.kind === 'store' || b.store) kind = kind === kn.store ? kind : kind + ' · ' + kn.store;
    txt(E.bcKind, kind);
    var eta = G.Map.fleetEta(r);
    txt(E.bcFleet, eta <= 0 ? '叛军舰队已追上这里！' : '叛军舰队约 ' + eta + ' 跳后抵达');
    cls(E.bcFleet, 'danger', eta <= 1);
    var left = G.Map.jumpsLeft(s, r.at);
    var exitTxt;
    if ((r.res.fuel || 0) <= 0 && r.mode === 'hub') exitTxt = '燃料耗尽 · 打开星图等待救援';
    else if (left === 0) exitTxt = G.Run.isFinalSector(r) ? '叛军旗舰就在这里' : '已抵达出口 · 打开星图前往下一星区';
    else exitTxt = '距出口 ' + left + ' 跳 · 燃料 ' + r.res.fuel;
    txt(E.bcExit, exitTxt);
    var hz = b.hazard && b.hazard !== 'none' ? G.data.text.hazardNames[b.hazard] : '';
    txt(E.bcHaz, hz ? '环境：' + hz : '');
    show(E.bcHaz, !!hz);
  }

  function avgO2(p) {
    var s = 0;
    for (var i = 0; i < p.rooms.length; i++) s += p.rooms[i].o2;
    return p.rooms.length ? s / p.rooms.length : 100;
  }

  function pipRow(host, list, n) {
    if (list.length === n) return list;
    G.dom.clear(host);
    list = [];
    for (var i = 0; i < n; i++) { var el = G.dom.h('i.pip'); host.appendChild(el); list.push(el); }
    return list;
  }
  // Pip states for a system: on (powered), off (usable, unpowered), ion, dmg.
  function paintPips(list, sys, p) {
    var P = sys.id === 'weapons' ? G.Ship.weaponPower(p) : sys.power;
    if (sys.id === 'piloting') P = G.Ship.usable(sys);
    var U = G.Ship.usable(sys);
    for (var i = 0; i < list.length; i++) {
      var st = i < P ? 'on' : i < U ? 'off' : i < U + sys.ion ? 'ion' : 'dmg';
      if (list[i]._st !== st) { list[i]._st = st; list[i].className = 'pip ' + st; }
    }
  }

  function sysDetail(r, sid) {
    var p = r.player, s = p.systems[sid], R = G.data.rules;
    switch (sid) {
      case 'shields': return G.Ship.maxLayers(p) + ' 层护盾' + (G.Ship.isManned(p, 'shields') ? ' · 有人操作' : '');
      case 'engines': return '闪避 ' + G.Ship.evasion(p) + '% · 跃迁 ' + Math.round(G.Ship.ftlTime(p)) + 's';
      case 'weapons': return '武器能量 ' + G.Ship.weaponPower(p) + '/' + G.Ship.usable(s);
      case 'oxygen': return s.power > 0 ? '补氧 +' + R.oxygenRate[Math.min(s.power, R.oxygenRate.length - 1)] + '%/秒' : '氧气在缓慢流失';
      case 'medbay': return s.power > 0 ? '治疗 ' + R.medbayHps[Math.min(s.power, R.medbayHps.length - 1)] + ' 点/秒' : '未供能，无法治疗';
      default: return '';
    }
  }

  function buildQp(r, slot) {
    var e = r.combat.enemy, h = G.dom.h;
    var key = e.name + '|' + slot + '|' + e.rooms.length + '|' + Object.keys(e.systems).join(',');
    if (B.qpKey === key && B.qpEnemy === e) return;
    B.qpKey = key;
    B.qpEnemy = e;
    G.dom.clear(E.cxwQp);
    E.qp = [];
    QP_ORDER.forEach(function (sid) {
      var sys = e.systems[sid];
      if (!sys) return;
      var el = h('button.qp', { 'data-act': 'qp', 'data-room': String(sys.room), 'aria-label': defs()[sid].name }, G.dom.icon(sid));
      E.cxwQp.appendChild(el);
      E.qp.push({ el: el, sys: sys });
    });
    E.cxwQp.scrollLeft = 0;
  }

  function updateCtx(r) {
    var s = V.sel, p = r.player, combat = r.mode === 'combat' && r.combat;
    var mode = s.mode !== 'none' ? s.mode : combat ? 'none' : 'hub';
    show(E.cxNone, mode === 'none');
    show(E.cxWeapon, mode === 'weapon');
    show(E.cxCrew, mode === 'crew');
    show(E.cxSys, mode === 'system');
    show(E.cxHub, mode === 'hub');
    var nt = noteText();

    if (mode === 'none') {
      var c = r.combat;
      txt(E.cxEva, '闪避 ' + G.Ship.evasion(p) + '%');
      var o2 = Math.round(avgO2(p));
      txt(E.cxO2, '氧 ' + o2 + '%');
      cls(E.cxO2, 'danger', o2 < 40);
      var hz = '';
      if (c.hazard === 'fleet') {
        hz = '舰队炮击 ' + Math.ceil(Math.max(0, c.hazardT.fleet)) + 's';
        if (c.flags && c.flags.fleetShots > 1) hz += ' ×' + c.flags.fleetShots;
      } else if (c.hazard === 'sun') hz = '恒星耀斑 ' + Math.ceil(Math.max(0, c.hazardT.flare)) + 's';
      else if (c.hazard === 'asteroid') hz = '小行星带';
      if (c.boss && c.enemy.phase === 2) hz = '能量涌动 ' + Math.ceil(Math.max(0, c.enemy.surgeT)) + 's';
      if (nt) hz = nt;
      txt(E.cxHaz, hz);
      cls(E.cxHaz, 'note', !!nt);
      var canFlee = fleeOk(r), noFuel = G.Combat.canFlee(r) && !canFlee;
      show(E.cxFlee, canFlee);
      show(E.cxFtlBar, !canFlee);
      if (!canFlee) {
        bar(E.cxFtlFill, p.ftl);
        var ft, bad = false;
        if (c.boss) { ft = '无法逃离'; bad = true; }
        else if (noFuel) { ft = '燃料耗尽'; bad = true; }
        else if (c.pending || c.result) ft = '跃迁 ' + Math.floor(p.ftl * 100) + '%';
        else if (!G.Ship.canChargeFtl(p)) {
          bad = true;
          ft = !p.systems.engines || p.systems.engines.power <= 0 ? '引擎无能量' : '需要驾驶员';
        } else ft = '跃迁充能 ' + Math.floor(p.ftl * 100) + '%';
        txt(E.cxFtlTxt, ft);
        cls(E.cxFtlBar, 'bad', bad);
      }
      cls(E.cxVolley, 'on', !!r.volley);
    } else if (mode === 'weapon') {
      var w = p.weapons[s.slot], def = G.data.weapons[w.id];
      buildQp(r, s.slot);
      txt(E.cxwName, '〔' + def.short + '〕');
      txt(E.cxwHint, !w.on ? '未供能' : def.missile ? '选目标·单发' : w.target != null ? '改选目标' : '选目标');
      cls(E.cxwHint, 'danger', !w.on);
      show(E.cxwQp, !nt);
      show(E.cxwNote, !!nt);
      if (nt) txt(E.cxwNote, nt);
      for (var i = 0; i < E.qp.length; i++) {
        var q = E.qp[i];
        cls(q.el, 'dmg', q.sys.damage > 0);
        cls(q.el, 'ion', q.sys.ion > 0);
        cls(q.el, 'cur', w.target === q.sys.room);
      }
      dis(E.cxwClear, w.target == null);
      txt(E.cxwPower, w.on ? '断电' : '通电');
      cls(E.cxwPower, 'on', !w.on);
    } else if (mode === 'crew') {
      var cm = G.U.byId(p.crew, s.crewId), race = G.data.crew.races[cm.race];
      prop(E.cxcDisc, '--race', race.color);
      txt(E.cxcName, cm.name);
      txt(E.cxcInfo, race.name);
      txt(E.cxcHp, 'HP ' + Math.ceil(cm.hp) + '/' + cm.hpMax);
      cls(E.cxcHp, 'danger', cm.hp < cm.hpMax * 0.35);
      dis(E.cxcStation, cm.station == null || G.Crew.dest(cm) === cm.station);
    } else if (mode === 'system') {
      var sys = p.systems[s.sysId];
      if (B.cxsKey !== s.sysId) {
        B.cxsKey = s.sysId;
        G.dom.clear(E.cxsIcon).appendChild(G.dom.icon(s.sysId));
        txt(E.cxsName, defs()[s.sysId].name);
      }
      E.cxsPipList = pipRow(E.cxsPips, E.cxsPipList || [], sys.level);
      paintPips(E.cxsPipList, sys, p);
      var P = s.sysId === 'weapons' ? G.Ship.weaponPower(p) : sys.power;
      txt(E.cxsVal, P + '/' + sys.level);
      txt(E.cxsDetail, nt || sysDetail(r, s.sysId));
      cls(E.cxsDetail, 'danger', !!nt);
    } else {
      var sec = r.sector;
      if (sec) {
        txt(E.cxhSector, sec.name);
        var eta = G.Map.fleetEta(r);
        txt(E.cxhFleet, eta <= 0 ? '叛军舰队已追上' : '叛军舰队约 ' + eta + ' 跳');
        cls(E.cxhFleet, 'danger', eta <= 1);
        txt(E.cxhFuel, '燃料 ' + r.res.fuel);
        cls(E.cxhFuel, 'danger', r.res.fuel <= 2);
      }
    }
  }

  function buildCrew(p) {
    var key = p.crew.map(function (c) { return c.id + ':' + c.name + ':' + c.race; }).join(',');
    if (key === B.crewKey) return;
    B.crewKey = key;
    var h = G.dom.h;
    G.dom.clear(E.crewGrid);
    E.ct = p.crew.map(function (c) {
      var race = G.data.crew.races[c.race] || G.data.crew.races.human;
      var t = { id: c.id, hp: h('i'), badge: h('b.cbadge') };
      t.el = h('div.ctile', { 'data-act': 'crew', 'data-id': c.id, 'aria-label': c.name, style: { '--race': race.color } },
        h('i.cdisc'), t.badge, h('span.cn', c.name.slice(0, 2)), h('span.chp', t.hp));
      E.crewGrid.appendChild(t.el);
      return t;
    });
  }

  function updateCrew(r) {
    var p = r.player;
    buildCrew(p);
    for (var i = 0; i < E.ct.length; i++) {
      var t = E.ct[i], c = p.crew[i];
      if (!c || c.id !== t.id) continue;
      var f = c.hp / c.hpMax;
      bar(t.hp, f);
      cls(t.el, 'hurt', f < 0.35);
      cls(t.el, 'sel', V.sel.mode === 'crew' && V.sel.crewId === c.id);
      txt(t.badge, TASK_BADGE[c.task] || '');
      if (t.badge._task !== c.task) { t.badge._task = c.task; t.badge.className = 'cbadge t-' + c.task; }
    }
    show(E.crewAll, p.crew.length > 0);
  }

  function buildCards(p) {
    var n = Math.max(p.weaponSlots, p.weapons.length);
    var key = n + ':' + p.weapons.map(function (w) { return w.uid + w.id; }).join(',');
    if (key === B.weapKey) return;
    B.weapKey = key;
    var h = G.dom.h;
    G.dom.clear(E.wCards);
    E.cards = [];
    for (var i = 0; i < n; i++) {
      var w = p.weapons[i];
      if (!w) {
        E.wCards.appendChild(h('div.wcard.empty', { 'data-act': 'wempty' }, h('span.wc-n', String(i + 1)), h('span.wc-empty', '空槽')));
        continue;
      }
      var def = G.data.weapons[w.id];
      var c = { fill: h('i'), tgt: h('span.wc-tgt'), pips: [], missile: !!def.missile };
      var pipsEl = h('span.wc-pips');
      for (var k = 0; k < def.power; k++) { var pe = h('i.pip'); pipsEl.appendChild(pe); c.pips.push(pe); }
      c.el = h('div.wcard', { 'data-act': 'weapon', 'data-slot': String(i), 'aria-label': def.name, 'data-type': def.type },
        h('div.wc-top', h('span.wc-n', String(i + 1)), h('span.wc-name', def.short)),
        h('span.wc-bar', c.fill),
        h('div.wc-bot', pipsEl, c.tgt));
      E.wCards.appendChild(c.el);
      E.cards[i] = c;
    }
  }

  function updateWeapons(r) {
    var p = r.player, combat = r.mode === 'combat' && !!r.combat;
    show(E.wCards, combat);
    show(E.wHub, !combat);
    if (combat) {
      buildCards(p);
      var e = r.combat.enemy;
      for (var i = 0; i < p.weapons.length; i++) {
        var c = E.cards[i], w = p.weapons[i];
        if (!c) continue;
        var st = G.Combat.weaponState(r, p, i);
        // charged but untargeted (missiles clear their target after every shot): it will never fire by itself
        var idle = st.why === 'noTarget' && st.frac >= 1;
        cls(c.el, 'on', w.on);
        cls(c.el, 'full', w.on && st.frac >= 1 && !idle);
        cls(c.el, 'idle', idle);
        cls(c.el, 'ready', st.why === '');
        cls(c.el, 'wait', st.why === 'volley');
        cls(c.el, 'nomis', st.why === 'noMissiles');
        cls(c.el, 'armed', V.sel.mode === 'weapon' && V.sel.slot === i);
        bar(c.fill, st.frac);
        for (var k = 0; k < c.pips.length; k++) cls(c.pips[k], 'on', w.on);
        // bottom-right badge: 无弹 > 选目标 (charged, no target) > target system > '单发' tag (missile weapons: one tap = one missile)
        var tg = '', tag = false;
        if (st.why === 'noMissiles') tg = '无弹';
        else if (idle) tg = '选目标';
        else if (w.target != null && e.rooms[w.target]) {
          var rs = e.rooms[w.target].sys;
          tg = '◎' + (rs ? defs()[rs].short : '空');
        } else if (c.missile) { tg = '单发'; tag = true; }
        txt(c.tgt, tg);
        cls(c.tgt, 'tag', tag);
        cls(c.tgt, 'pick', idle);
      }
    } else {
      var hub = r.mode === 'hub';
      dis(E.hubMap, !hub);
      dis(E.hubShip, !hub);
      show(E.hubStore, hub && G.Run.hasStore(r));
    }
    var paused = !!(G.App && G.App.paused);
    if (E.pause._pz !== paused) {
      E.pause._pz = paused;
      G.dom.clear(E.pause).appendChild(G.dom.icon(paused ? 'play' : 'pause'));
      E.pause.setAttribute('aria-label', paused ? '继续' : '暂停');
    }
    cls(E.pause, 'paused', paused);
  }

  function updateSystems(r) {
    var p = r.player;
    var free = G.Ship.reactorFree(p), used = G.Ship.reactorUsed(p);
    txt(E.rxFree, free);
    txt(E.rxUsed, used + '/' + p.reactor);
    cls(E.reactor, 'empty', free <= 0);
    var showPips = p.reactor <= 12;
    show(E.rxPips, showPips);
    if (showPips) {
      E.rxPipList = pipRow(E.rxPips, E.rxPipList || [], p.reactor);
      for (var i = 0; i < E.rxPipList.length; i++) cls(E.rxPipList[i], 'on', i < free);

    var b = G.Run.beacon(run);
    var K = G.data.text.kindNames || {};
    if (!b) return '信标';
    if (b.kind === 'boss') return K.boss || '叛军旗舰';
    if (G.Map.isOvertaken(run.sector, b)) return '叛军舰队';
    if (b.exit) return K.exit || '星区出口';

  function stateKey(run) {
    var e = run.event;

  }

  function choose(entry, idx) {
    var run = S().run();
    if (!run || !run.event) return;
    var res = G.Events.choose(run, idx);
    if (!res) { S().deny('无法选择'); return; }
    S().sfx(res.fx && res.fx.some(function (f) { return f.good && f.key === 'scrap'; }) ? 'coin' : 'click');
    // an empty outcome already closed the event (mode hub) → the router closes this sheet
    if (!run.event) { S().sync(); return; }
    S().sync();
    render(entry, true);
  }

  function next(entry) {

    var kind = run.event.result.next;

    S().sfx(kind === 'combat' ? 'alarm' : 'click');
    S().sync();
    if (r && r.openStore && G.Run.hasStore(run)) G.UI.open('store');

    var run = S().run(), ui = entry.state.ui;
    if (!run || !run.event) return;

    entry.state.key = key;

    var res = run.event.result;

    }
  }

  G.UI.register('event', {
    modal: true, cls: 'event-screen',
    mount: function (entry) {
      var ui = G.UI.sheet(entry, { title: '', close: false, cls: 'event-sheet' });
      var resHost = h('div.ev-res');
      ui.head.appendChild(resHost);
      entry.state.ui = { title: ui.head.querySelector('.sheet-title'), res: resHost, body: ui.body, foot: ui.foot };
